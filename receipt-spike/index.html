<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>🧾 レシート spike</title>
<style>
:root{ --bg:#111; --card:#1c1c1e; --line:#2c2c2e; --fg:#eee; --dim:#9a9a9e; --acc:#7ad; --err:#f0a0a0; --ok:#9fd8a0; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif; padding-bottom:90px;}
header{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; background:rgba(17,17,17,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
header h1{font-size:18px; margin:0; flex:1;}
.hbtn{background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:16px;}
#shoot{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 14px); z-index:5;}
#shoot label{display:flex; align-items:center; gap:8px; background:var(--acc); color:#04121f; font-weight:700; font-size:17px; border-radius:28px; padding:14px 26px; box-shadow:0 4px 16px rgba(0,0,0,.5);}
#shoot input{display:none;}
main{padding:10px 14px;}
.empty{color:var(--dim); text-align:center; padding:48px 20px;}
.mon{margin:18px 0 6px; display:flex; align-items:baseline; gap:8px;}
.mon b{font-size:15px;}
.mon span{color:var(--dim); font-size:13px; margin-left:auto;}
.rec{display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; margin-bottom:8px;}
.rec img{width:52px; height:52px; object-fit:cover; border-radius:8px; background:#000;}
.rec .mid{flex:1; min-width:0;}
.rec .st{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rec .sub{color:var(--dim); font-size:12.5px;}
.rec .amt{font-size:16px; font-weight:700; white-space:nowrap;}
.rec .amt.na{color:var(--dim); font-weight:400; font-size:13px;}
.chip{display:inline-block; font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:0 6px; margin-left:6px;}
.rec button{background:none; border:1px solid var(--line); color:var(--acc); border-radius:8px; padding:6px 10px; font-size:14px;}
.pend{color:var(--acc);} .errt{color:var(--err);}
.overlay{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.75); display:none; align-items:flex-end; justify-content:center;}
.overlay.on{display:flex;}
.sheet{background:var(--bg); border-top:1px solid var(--line); border-radius:16px 16px 0 0; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);}
.sheet h2{font-size:16px; margin:0 0 12px;}
.sheet .x{float:right; background:none; border:none; color:var(--dim); font-size:20px; padding:2px 8px;}
.row{margin-bottom:12px;}
.row label{display:block; font-size:13px; color:var(--dim); margin-bottom:4px;}
.row input,.row select{width:100%; background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:10px; font-size:16px;}
.btn{display:block; width:100%; background:var(--card); border:1px solid var(--line); color:var(--fg); border-radius:12px; padding:12px; font-size:16px; margin-bottom:8px; text-align:center;}
.btn.pri{background:var(--acc); color:#04121f; font-weight:700; border:none;}
.note{font-size:12.5px; color:var(--dim); margin-top:10px;}
.note a{color:var(--acc);}
#dImg{width:100%; border-radius:12px; background:#000; margin-bottom:10px;}
.kv{display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding:6px 0; font-size:14.5px;}
.kv span:first-child{color:var(--dim);}
table.items{width:100%; border-collapse:collapse; font-size:13.5px; margin:8px 0;}
table.items td{padding:4px 2px; border-bottom:1px solid var(--line);}
table.items td:last-child{text-align:right; white-space:nowrap;}
.dual{display:flex; gap:8px;} .dual .btn{flex:1;}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 80px); background:#2c2c2e; color:var(--fg); border-radius:12px; padding:10px 16px; font-size:14px; z-index:30; display:none; max-width:86vw;}
</style>
</head>
<body>
<header>
  <h1>🧾 レシート</h1>
  <button class="hbtn" id="btnExport" title="期間を指定して書き出し">📤</button>
  <button class="hbtn" id="btnSettings" title="設定">⚙</button>
</header>

<main><div id="list"></div></main>

<div id="shoot">
  <label>📷 レシートを撮る<input type="file" accept="image/*" capture="environment" multiple id="photoInput"></label>
</div>

<!-- ⚙ 設定 -->
<div class="overlay" id="ovSettings"><div class="sheet">
  <button class="x" data-close>✕</button><h2>⚙ 設定</h2>
  <div class="row"><label>Anthropic APIキー（<a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a> で発行）</label>
    <input type="password" id="inKey" placeholder="sk-ant-..." autocomplete="off"></div>
  <div class="row"><label>分析モデル</label><select id="inModel">
    <option value="claude-opus-5">Claude Opus 5（既定・最高精度 / 約2〜3円/枚）</option>
    <option value="claude-sonnet-5">Claude Sonnet 5（速い / 約1〜2円/枚）</option>
    <option value="claude-haiku-4-5">Claude Haiku 4.5（最安 / 1円未満/枚）</option>
  </select></div>
  <button class="btn" id="btnTest">🔌 接続テスト（無料・課金されません）</button>
  <div class="note">キーは<b>この端末のブラウザ内にのみ</b>保存されます（このアプリにサーバーはありません）。レシート画像は分析のときだけ、<b>あなたのキーで Anthropic API に直接</b>送信されます。それ以外に外部へ送るものはありません。</div>
  <div class="note" id="buildLine"></div>
</div></div>

<!-- 📤 書き出し -->
<div class="overlay" id="ovExport"><div class="sheet">
  <button class="x" data-close>✕</button><h2>📤 期間を指定して書き出し</h2>
  <div class="dual">
    <div class="row" style="flex:1"><label>から</label><input type="date" id="expFrom"></div>
    <div class="row" style="flex:1"><label>まで</label><input type="date" id="expTo"></div>
  </div>
  <div class="note" id="expCount" style="margin:0 0 10px"></div>
  <button class="btn pri" id="btnShare">📤 共有シートで渡す（AIアプリ・Drive等へ）</button>
  <div class="dual">
    <button class="btn" id="btnJson">📄 JSON<br><small>AI向け</small></button>
    <button class="btn" id="btnCsv">📊 CSV<br><small>表計算向け</small></button>
  </div>
  <div class="note">JSON は AI にそのまま渡せる形式（バージョン付き）。リンク共有したい場合は、共有シートから自分の Drive / iCloud に保存し、そのリンクを AI に渡してください（このアプリはリンクをホストしません）。</div>
</div></div>

<!-- 詳細 -->
<div class="overlay" id="ovDetail"><div class="sheet">
  <button class="x" data-close>✕</button><h2 id="dTitle">レシート</h2>
  <img id="dImg" alt="レシート画像">
  <div id="dBody"></div>
  <div class="dual" style="margin-top:12px">
    <button class="btn" id="btnReanalyze">🔁 再分析</button>
    <button class="btn" id="btnDelete" style="color:var(--err)">🗑 削除</button>
  </div>
</div></div>

<div id="toast"></div>

<script>
'use strict';
const BUILD = 'r1 🧾 撮る→自動AI分析→一覧→期間書き出し · 2026-08-10';
console.log('BUILD:', BUILD);

/* ---------- 設定（localStorage は あの日 web と同一オリジン共有 → rcpt. 接頭辞で分離） ---------- */
const LS_KEY = 'rcpt.apiKey', LS_MODEL = 'rcpt.model';
const getKey   = () => localStorage.getItem(LS_KEY) || '';
const getModel = () => localStorage.getItem(LS_MODEL) || 'claude-opus-5';

/* ---------- IndexedDB（あの日と同一オリジン共有 → DB名で分離） ---------- */
const DB_NAME = 'receipt-spike', STORE = 'receipts';
let _db = null;
function db(){ return _db ? Promise.resolve(_db) : new Promise((ok, ng) => {
  const rq = indexedDB.open(DB_NAME, 1);
  rq.onupgradeneeded = () => rq.result.createObjectStore(STORE, { keyPath: 'id' });
  rq.onsuccess = () => { _db = rq.result; ok(_db); };
  rq.onerror = () => ng(rq.error);
}); }
const tx = (mode, fn) => db().then(d => new Promise((ok, ng) => {
  const t = d.transaction(STORE, mode); const r = fn(t.objectStore(STORE));
  t.oncomplete = () => ok(r && 'result' in r ? r.result : undefined);
  t.onerror = () => ng(t.error);
}));
const dbPut = rec => tx('readwrite', s => s.put(rec));
const dbDel = id  => tx('readwrite', s => s.delete(id));
const dbGet = id  => tx('readonly',  s => s.get(id));
const dbAll = ()  => tx('readonly',  s => s.getAll());

/* ---------- 画像（iOS の教訓: createImageBitmap でなく <img>+<canvas>、URL は必ず revoke） ---------- */
function loadImage(blob){ return new Promise((ok, ng) => {
  const url = URL.createObjectURL(blob); const im = new Image();
  im.onload = () => ok({ im, url });
  im.onerror = () => { URL.revokeObjectURL(url); ng(new Error('画像を読み込めません')); };
  im.src = url;
}); }
async function downscale(blob, maxLong, quality){
  const { im, url } = await loadImage(blob);
  try {
    const w = im.naturalWidth, h = im.naturalHeight;
    const s = Math.min(1, maxLong / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const out = await new Promise(ok => c.toBlob(ok, 'image/jpeg', quality));
    if (!out) throw new Error('画像の縮小に失敗しました');
    return out;
  } finally { URL.revokeObjectURL(url); }
}
const blobToB64 = blob => new Promise((ok, ng) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1]);
  r.onerror = () => ng(r.error);
  r.readAsDataURL(blob);
});

/* ---------- Claude API（BYOキー・端末→APIへ直接。CORSは公式オプトインヘッダで許可される） ---------- */
const API = 'https://api.anthropic.com/v1';
function apiHeaders(){ return {
  'content-type': 'application/json',
  'x-api-key': getKey(),
  'anthropic-version': '2023-06-01',
  'anthropic-dangerous-direct-browser-access': 'true',
}; }
async function apiPost(path, body){
  if (!getKey()) throw new Error('APIキーが未設定です（⚙ から登録）');
  const res = await fetch(API + path, { method: 'POST', headers: apiHeaders(), body: JSON.stringify(body) });
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { msg = (await res.json()).error?.message || msg; } catch (_) {}
    if (res.status === 401) msg = 'APIキーが無効です（⚙ で確認を）';
    if (res.status === 429) msg = 'レート制限中。少し待って 🔁 再分析を';
    throw new Error(msg);
  }
  return res.json();
}

const NULLABLE = t => ({ anyOf: [{ type: t }, { type: 'null' }] });
const RECEIPT_SCHEMA = {
  type: 'object', additionalProperties: false,
  properties: {
    store:    NULLABLE('string'),
    date:     NULLABLE('string'),
    time:     NULLABLE('string'),
    total:    NULLABLE('integer'),
    currency: { type: 'string' },
    category: { type: 'string', enum: ['食料品','外食','日用品','交通','医療','衣料','趣味・娯楽','その他'] },
    payment:  NULLABLE('string'),
    items: { type: 'array', items: {
      type: 'object', additionalProperties: false,
      properties: { name: { type: 'string' }, price: NULLABLE('integer'), qty: NULLABLE('integer') },
      required: ['name', 'price', 'qty'],
    } },
  },
  required: ['store', 'date', 'time', 'total', 'currency', 'category', 'payment', 'items'],
};

async function analyzeReceipt(rec){
  const model = getModel();
  const output_config = { format: { type: 'json_schema', schema: RECEIPT_SCHEMA } };
  if (model !== 'claude-haiku-4-5') output_config.effort = 'low'; // effort は Haiku 4.5 非対応
  const res = await apiPost('/messages', {
    model, max_tokens: 3000, output_config,
    messages: [{ role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await blobToB64(rec.img) } },
      { type: 'text', text: 'これはレシートの写真です。記載内容を読み取り、スキーマに従って構造化してください。読み取れない・存在しない項目は null。total は税込の支払総額（通貨の最小単位の整数、日本円なら円）。date は YYYY-MM-DD。currency は ISO 4217（例: JPY）。品目は主要なものを上から順に。' },
    ] }],
  });
  if (res.stop_reason === 'refusal') throw new Error('AI が分析を拒否しました（画像を確認してください）');
  const text = (res.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  return { data: JSON.parse(text), meta: { model: res.model, in: res.usage?.input_tokens, out: res.usage?.output_tokens, at: Date.now() } };
}

/* ---------- 取り込み → 自動分析 ---------- */
document.getElementById('photoInput').addEventListener('change', async e => {
  const files = [...e.target.files];
  try {
    for (const f of files) {
      const [img, thumb] = [await downscale(f, 1568, 0.85), await downscale(f, 320, 0.7)];
      const rec = { id: 'r' + Date.now() + Math.random().toString(36).slice(2, 7),
                    ts: Date.now(), status: 'pending', img, thumb, data: null, error: null, meta: null };
      await dbPut(rec); await renderList();
      runAnalysis(rec.id); // 待たずに次の1枚へ（分析は非同期で進む）
    }
  } catch (err) { toast('取り込み失敗: ' + err.message); }
  finally { e.target.value = ''; } // iOS の教訓: await の前に消さない
});

async function runAnalysis(id){
  let rec = await dbGet(id); if (!rec) return;
  rec.status = 'pending'; rec.error = null; await dbPut(rec); await renderList();
  try {
    const { data, meta } = await analyzeReceipt(rec);
    rec = await dbGet(id); if (!rec) return; // 分析中に削除されたら破棄
    rec.status = 'done'; rec.data = data; rec.meta = meta;
  } catch (err) {
    rec = await dbGet(id); if (!rec) return;
    rec.status = 'error'; rec.error = String(err.message || err);
  }
  await dbPut(rec); await renderList();
  if (rec.status === 'error') toast('❌ ' + rec.error);
}

/* ---------- 一覧（レシート記載の日付降順・月グループ＋月合計） ---------- */
const thumbUrls = [];
const recDate = r => (r.data?.date) || new Date(r.ts).toISOString().slice(0, 10);
const yen = n => '¥' + Number(n).toLocaleString('ja-JP');
const money = r => r.data?.total == null ? null :
  (r.data.currency && r.data.currency !== 'JPY' ? `${r.data.total.toLocaleString()} ${r.data.currency}` : yen(r.data.total));

async function renderList(){
  const all = (await dbAll()).sort((a, b) => recDate(b).localeCompare(recDate(a)) || b.ts - a.ts);
  const list = document.getElementById('list');
  thumbUrls.splice(0).forEach(u => URL.revokeObjectURL(u));
  if (!all.length) { list.innerHTML = '<div class="empty">📷 でレシートを撮ると、自動で読み取りが始まります。<br>まず ⚙ で APIキーを登録してください。</div>'; return; }
  let html = '', curMonth = '';
  for (const r of all) {
    const m = recDate(r).slice(0, 7);
    if (m !== curMonth) {
      curMonth = m;
      const monthTotal = all.filter(x => recDate(x).slice(0, 7) === m && x.data?.total != null && (x.data.currency || 'JPY') === 'JPY')
                            .reduce((s, x) => s + x.data.total, 0);
      html += `<div class="mon"><b>${m.replace('-', '年')}月</b><span>${monthTotal ? yen(monthTotal) : ''}</span></div>`;
    }
    const turl = URL.createObjectURL(r.thumb); thumbUrls.push(turl);
    const title = r.status === 'done' ? (r.data.store || '店名不明')
                : r.status === 'pending' ? '<span class="pend">🤖 読み取り中…</span>'
                : '<span class="errt">読み取り失敗</span>';
    const amt = money(r);
    html += `<div class="rec" data-id="${r.id}">
      <img src="${turl}" alt="">
      <div class="mid"><div class="st">${title}${r.status === 'done' ? `<span class="chip">${r.data.category || ''}</span>` : ''}</div>
      <div class="sub">${recDate(r)}${r.data?.time ? ' ' + r.data.time : ''}</div></div>
      ${r.status === 'error' ? `<button data-retry="${r.id}">🔁</button>` : `<div class="amt ${amt ? '' : 'na'}">${amt || '—'}</div>`}
    </div>`;
  }
  list.innerHTML = html;
}
document.getElementById('list').addEventListener('click', e => {
  const retry = e.target.closest('[data-retry]');
  if (retry) { runAnalysis(retry.dataset.retry); return; }
  const row = e.target.closest('.rec');
  if (row) openDetail(row.dataset.id);
});

/* ---------- 詳細 ---------- */
let detailId = null, detailUrl = null;
async function openDetail(id){
  const r = await dbGet(id); if (!r) return;
  detailId = id;
  if (detailUrl) URL.revokeObjectURL(detailUrl);
  detailUrl = URL.createObjectURL(r.img);
  document.getElementById('dImg').src = detailUrl;
  document.getElementById('dTitle').textContent = r.data?.store || 'レシート';
  const d = r.data, kv = (k, v) => v == null ? '' : `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
  document.getElementById('dBody').innerHTML = !d
    ? `<div class="note">${r.status === 'pending' ? '🤖 読み取り中…' : '❌ ' + (r.error || '未分析')}</div>`
    : kv('日付', d.date) + kv('時刻', d.time) + kv('合計', money(r)) + kv('カテゴリ', d.category) + kv('支払', d.payment)
      + (d.items?.length ? '<table class="items">' + d.items.map(i =>
          `<tr><td>${i.name}${i.qty > 1 ? ' ×' + i.qty : ''}</td><td>${i.price != null ? yen(i.price) : ''}</td></tr>`).join('') + '</table>' : '')
      + (r.meta ? `<div class="note">${r.meta.model} / in ${r.meta.in} · out ${r.meta.out} tokens</div>` : '');
  show('ovDetail');
}
document.getElementById('btnReanalyze').onclick = () => { hideAll(); runAnalysis(detailId); };
document.getElementById('btnDelete').onclick = async () => {
  if (!confirm('このレシートを削除しますか？')) return;
  await dbDel(detailId); hideAll(); renderList();
};

/* ---------- 書き出し（期間指定 → JSON / CSV / OS共有シート） ---------- */
async function exportTargets(){
  const from = document.getElementById('expFrom').value, to = document.getElementById('expTo').value;
  const all = await dbAll();
  return { from, to, recs: all.filter(r => { const d = recDate(r); return (!from || d >= from) && (!to || d <= to); })
                              .sort((a, b) => recDate(a).localeCompare(recDate(b))) };
}
function exportJson(recs, from, to){
  return JSON.stringify({
    format: 'receipt-spike-export', version: 1,
    exported_at: new Date().toISOString(), period: { from: from || null, to: to || null },
    count: recs.length,
    receipts: recs.map(r => ({ id: r.id, captured_at: new Date(r.ts).toISOString(), status: r.status, ...(r.data || {}) })),
  }, null, 1);
}
function exportCsv(recs){
  const esc = v => v == null ? '' : /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const rows = [['日付', '時刻', '店名', '合計', '通貨', 'カテゴリ', '支払', '品目'].join(',')];
  for (const r of recs) {
    const d = r.data || {};
    rows.push([recDate(r), d.time, d.store, d.total, d.currency, d.category, d.payment,
               (d.items || []).map(i => i.name).join('、')].map(esc).join(','));
  }
  return '﻿' + rows.join('\n'); // BOM: Excel の文字化け対策
}
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const expName = (from, to, ext) => `receipts_${from || 'all'}_${to || 'all'}.${ext}`;
document.getElementById('btnJson').onclick = async () => {
  const { from, to, recs } = await exportTargets();
  download(expName(from, to, 'json'), exportJson(recs, from, to), 'application/json');
};
document.getElementById('btnCsv').onclick = async () => {
  const { from, to, recs } = await exportTargets();
  download(expName(from, to, 'csv'), exportCsv(recs), 'text/csv');
};
document.getElementById('btnShare').onclick = async () => {
  const { from, to, recs } = await exportTargets();
  const file = new File([exportJson(recs, from, to)], expName(from, to, 'json'), { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'レシートデータ' }); } catch (_) { /* キャンセル */ }
  } else { toast('この環境は共有シート非対応。JSON/CSV ダウンロードを使ってください'); }
};
async function refreshExpCount(){
  const { recs } = await exportTargets();
  const total = recs.filter(r => r.data?.total != null && (r.data.currency || 'JPY') === 'JPY').reduce((s, r) => s + r.data.total, 0);
  document.getElementById('expCount').textContent = `対象: ${recs.length}件 ${total ? '/ 合計 ' + yen(total) : ''}`;
}
document.getElementById('expFrom').onchange = refreshExpCount;
document.getElementById('expTo').onchange = refreshExpCount;

/* ---------- 設定 ---------- */
document.getElementById('inKey').onchange = e => { localStorage.setItem(LS_KEY, e.target.value.trim()); };
document.getElementById('inModel').onchange = e => { localStorage.setItem(LS_MODEL, e.target.value); };
document.getElementById('btnTest').onclick = async e => {
  const b = e.target; b.textContent = '🔌 確認中…';
  try {
    // count_tokens は無料エンドポイント＝キーの有効性確認に課金されない
    await apiPost('/messages/count_tokens', { model: getModel(), messages: [{ role: 'user', content: 'test' }] });
    b.textContent = '✅ 接続OK（キー有効）';
  } catch (err) { b.textContent = '❌ ' + err.message; }
  setTimeout(() => { b.textContent = '🔌 接続テスト（無料・課金されません）'; }, 4000);
};

/* ---------- モーダル・toast ---------- */
function show(id){ document.getElementById(id).classList.add('on'); }
function hideAll(){ document.querySelectorAll('.overlay').forEach(o => o.classList.remove('on')); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = hideAll);
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) hideAll(); }));
document.getElementById('btnSettings').onclick = () => {
  document.getElementById('inKey').value = getKey();
  document.getElementById('inModel').value = getModel();
  document.getElementById('buildLine').textContent = 'BUILD: ' + BUILD;
  show('ovSettings');
};
document.getElementById('btnExport').onclick = () => {
  const now = new Date(), p = n => String(n).padStart(2, '0');
  const today = `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}`;
  if (!document.getElementById('expFrom').value) document.getElementById('expFrom').value = today.slice(0, 8) + '01';
  if (!document.getElementById('expTo').value) document.getElementById('expTo').value = today;
  refreshExpCount(); show('ovExport');
};
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
}

/* ---------- 起動: 中断されていた分析を再開 ---------- */
(async () => {
  await renderList();
  if (getKey()) (await dbAll()).filter(r => r.status === 'pending').forEach(r => runAnalysis(r.id));
})();
</script>
